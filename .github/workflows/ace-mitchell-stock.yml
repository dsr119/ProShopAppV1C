# Reads bag and shoe SKUs from acemitchell.com, checks Ace Mitchell's stock
# for them (plus any codes in scraper/ace-mitchell-items.txt) and saves it to the Supabase vendor_stock table. The dealer login lives only
# in the ACE_MITCHELL_EMAIL / ACE_MITCHELL_PASSWORD repository secrets.

name: Ace Mitchell stock

on:
  schedule:
    # 10:30 UTC, early morning Eastern.
    - cron: '30 10 * * *'
  workflow_dispatch:
    inputs:
      item_codes:
        description: Codes to check instead of reading the site, comma separated (e.g. 59111100002, 59112302002)
        type: string
        default: ''
      dry_run:
        description: Check and print, but do not save anything
        type: boolean
        default: true

concurrency:
  group: ace-mitchell-stock
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  stock:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test against canned replies
        run: node --test tests/ace-mitchell.test.mjs tests/ace-mitchell-site.test.mjs
      - name: Check stock
        env:
          ACE_MITCHELL_EMAIL: ${{ secrets.ACE_MITCHELL_EMAIL }}
          ACE_MITCHELL_PASSWORD: ${{ secrets.ACE_MITCHELL_PASSWORD }}
          ACE_ITEM_CODES: ${{ inputs.item_codes }}
          SUPABASE_URL: https://ngghyuvykqqklztvvmld.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: node scraper/ace-mitchell.mjs
