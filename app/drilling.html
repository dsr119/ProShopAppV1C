<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drilling — Perfexxxxion Pro Shop</title>
<!-- The ?v= query is a cache buster. GitHub Pages serves static assets with a long
     cache life, so bump this on every deploy or browsers keep the old copy. -->
<link rel="stylesheet" href="style.css?v=10">
</head>
<body>

<header>
  <h1>Perfexxxxion Pro Shop</h1>
  <nav>
    <a href="index.html">Orders</a>
    <a href="drilling.html" class="active">Drilling</a>
    <a href="appointments.html">Appointments</a>
    <a href="order.html">New Order</a>
  </nav>
</header>

<main>
  <div id="error" class="error hidden"></div>

  <div class="toolbar">
    <input type="search" id="search" placeholder="Search name or item …">
    <select id="quarter"></select>
    <select id="location">
      <option value="">All pickup locations</option>
      <option>Valley</option>
      <option>South Side</option>
      <option>Both</option>
    </select>
    <label class="checkline">
      <input type="checkbox" id="showdone"> Show finished
    </label>
    <span class="spacer"></span>
    <span class="count" id="count"></span>
  </div>

  <div class="tablewrap">
    <table>
      <thead>
        <tr>
          <th>Status</th>
          <th class="col-name">Name</th>
          <th class="col-item">Item</th>
          <th class="nowrap">Phone</th>
          <th>Pickup</th>
          <th class="nowrap">Ordered</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty" class="empty-state hidden">Nothing waiting to be drilled.</div>
  </div>

  <div class="legend">
    <span>Customer orders only — shop stock is excluded.</span>
  </div>
</main>

<dialog id="dlg" class="wide">
  <form method="dialog" id="schedform">
    <h3>Schedule an appointment</h3>
    <div class="body">
      <div class="forwhom">
        <div class="nm" id="s_who"></div>
        <div class="it" id="s_what"></div>
      </div>

      <div>
        <div class="weeknav">
          <button type="button" id="s_prev" title="Previous week">&larr;</button>
          <button type="button" id="s_next" title="Next week">&rarr;</button>
          <button type="button" id="s_thisweek">This week</button>
          <span class="label" id="s_weeklabel"></span>
        </div>
        <div class="weekstrip" id="s_strip"></div>
        <div class="dayappts" id="s_dayappts"></div>
      </div>

      <div class="row2">
        <label>Time
          <input type="time" id="s_time" step="900">
        </label>
        <label>Location
          <select id="s_location">
            <option value="">—</option>
            <option>Valley</option>
            <option>South Side</option>
          </select>
        </label>
      </div>

      <label>What are we doing
        <textarea id="s_service" required></textarea>
      </label>
    </div>
    <div class="foot">
      <span class="count" id="s_picked"></span>
      <span class="spacer"></span>
      <button type="button" id="s_cancel">Cancel</button>
      <button type="submit" class="primary" id="s_save">Book it</button>
    </div>
  </form>
</dialog>

<script src="config.js?v=10"></script>
<script src="db.js?v=10"></script>
<script src="drilling.js?v=10"></script>
</body>
</html>
